function particles(n,hearts){return Array.from({length:n},()=>[Math.random(),rand(0,1.25),rand(hearts?.03:.05,hearts?.08:.11),rand(0,TAU),choose(hearts?DATA.heartColors:DATA.petalColors)]);}
let hearts=particles(16,true),petals=particles(26,false);
function render(t,ang,dt){if(!W||!H)return;depth.fill(-1e9);chars.fill('');let tilt=.30+.035*sin(t*.5);ca=cos(ang);sa=sin(ang);ct=cos(tilt);st=sin(tilt);sxs=scale*2;cx=cols/2;cy=(rows-1)/2+.06*scale;
for(let [x,y,p,s] of DATA.stars){let tw=sin(t*s+p);if(tw>0)plot(x*cols,y*rows,-80,tw>.93?'+':'·',tw>.93?252:tw>.5?247:240);}
for(let [group,isHeart] of [[hearts,true],[petals,false]])for(let p of group){p[1]-=p[2]*dt;if(p[1]<0){p[0]=Math.random();p[1]=1;p[4]=choose(isHeart?DATA.heartColors:DATA.petalColors);}let x=mod((p[0]+(isHeart?.015:.04)*sin(t*(isHeart?1.2:.9)+p[3]))*cols,cols),y=p[1]*rows;plot(x,y,-50,isHeart?'♥':",'`."[Math.floor(t*2.2+p[3]*3)%4],p[4]);}
core();for(let f of DATA.flowers){let g=ease((t-f.delay)/1.1);if(g>.02)flower(f,g,t);}points(DATA.points);points(moving(t));
let show=clamp((t-2.5)/2,0,1);if(show>0){for(let i=0;i<DATA.babies.length*show;i++){let [x,y,z,p]=DATA.babies[i],a=project(x,y,z),star=sin(t*2+p)>.6;plot(a[0],a[1],a[2]+.02,star?'*':'·',star?231:255);}for(let [x,y,z,p,s] of DATA.sparkles){let a=project(x,y,z),tw=sin(t*s+p);if(tw>0)plot(a[0],a[1],a[2],tw>.85?'*':tw>.4?'+':'·',tw>.85?231:tw>.4?225:218);}for(let [rad,y0,omega,p] of DATA.flies)for(let k=0;k<4;k++){let a=p+t*omega-k*.10*Math.sign(omega),yy=y0+.08*sin(t*.9+p),q=project(rad*cos(a),yy,rad*sin(a));plot(q[0],q[1],q[2]+.1,['*','+','·','·'][k],[229,223,218,175][k]);}}
ctx.clearRect(0,0,W,H);let x0=(W-cols*cw)/2,y0=(H-rows*ch)/2,last=-1;for(let i=0;i<chars.length;i++)if(chars[i]){if(colors[i]!==last){last=colors[i];ctx.fillStyle=CSS[last];}ctx.fillText(chars[i],x0+(i%cols)*cw,y0+(Math.floor(i/cols)+.5)*ch);}}
let angle=0,spin=1,paused=false,idx=0,msgStart=.9,start=performance.now(),lastFrame=start,lastTick=start;const messages=DATA.messages,msg=$('message');
function elapsed(){return (performance.now()-start)/1000;}
function next(){idx=(idx+1)%messages.length;msgStart=elapsed();}
function message(t){let s=messages[idx],tt=t-msgStart,n=s.length,type=n/28,hold=2.6+.03*n,erase=.9;if(tt<0){msg.textContent='';return;}if(tt>type+hold+erase+.5){idx=(idx+1)%messages.length;msgStart=t;s=messages[idx];tt=0;n=s.length;type=n/28;hold=2.6+.03*n;}let text;if(tt<type){text=s.slice(0,Math.floor(tt*28))+(Math.floor(t*3)%2===0?'_':'');}else if(tt<type+hold){text=s;}else if(tt<type+hold+erase){text=s.slice(Math.floor((tt-type-hold)/erase*n));}else{text='';}if(msg.textContent!==text)msg.textContent=text;}
function toggle(){paused=!paused;$('pause').textContent=paused?'Resume spin':'Pause spin';$('pause').setAttribute('aria-pressed',String(paused));}
function speed(mult){spin=Math.sign(spin)*clamp(abs(spin)*mult,.1,6);}
$('pause').onclick=toggle;$('reverse').onclick=()=>spin=-spin;$('slow').onclick=()=>speed(.8);$('fast').onclick=()=>speed(1.25);$('next').onclick=next;
window.addEventListener('keydown',e=>{if(e.target.tagName==='BUTTON')return;if(e.key===' '){e.preventDefault();toggle();}else if(e.key==='+'||e.key==='=')speed(1.25);else if(e.key==='-'||e.key==='_')speed(.8);else if(e.key.toLowerCase()==='r')spin=-spin;else if(e.key.toLowerCase()==='n')next();});
function tick(now){requestAnimationFrame(tick);if(now-lastFrame<1000/24)return;let dt=min(.1,max(0,(now-lastTick)/1000));lastFrame=now;lastTick=now;let t=(now-start)/1000;if(!paused)angle+=.55*spin*dt;render(t,angle,dt);message(t);}
requestAnimationFrame(tick);

</script></body></html>
